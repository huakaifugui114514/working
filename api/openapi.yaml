openapi: 3.0.3

info:
  title: KnowFlow Collections & Documents API
  version: 0.1.0
  description: |
    KnowFlow 知识库（collection）与文档（document）的 HTTP 契约。

    约定：
    - 成功响应直接返回资源 JSON，不套 `{data: ...}`。
    - 失败统一返回 `{"error":{"code":"...","message":"..."}}`。
    - 时间一律 UTC，RFC 3339 格式，毫秒精度。
    - `cursor` 是不透明 token；客户端只能原样回传，不要解析。
    - collections 列表按 `(created_at DESC, id DESC)` 排序。
    - 某个 collection 下的 documents 按 `(added_at DESC, document_id DESC)` 排序。
    - search 结果按 `(score DESC, chunk_id DESC)` 排序；`offset + limit <= 1000`。
    - agent/chat 是单轮 RAG；citations 是检索来源，index 对应 [n]。

servers:
  - url: /

tags:
  - name: collections
    description: 知识库的创建、查询、分页、更新与软删。
  - name: documents
    description: 文档元数据，以及文档与知识库的多对多关联。
  - name: search
    description: 基于 ngram FULLTEXT 的 chunk 级检索。
  - name: agent
    description: 单轮 RAG Agent（检索 + LLM 生成 + 引用）。

paths:
  /api/v1/collections:
    get:
      tags: [collections]
      operationId: listCollections
      summary: 分页列出知识库
      description: |
        返回按 `(created_at DESC, id DESC)` 排序的一页。
        `next_cursor` 为 `null` 表示没有下一页；否则把它原样作为下一次请求的 `cursor`。
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页条数，默认 20。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 `next_cursor`，原样回传；不要自己构造。
          schema:
            type: string
      responses:
        '200':
          description: 一页知识库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [collections]
      operationId: createCollection
      summary: 创建知识库
      description: |
        `name` 必填，首尾空白会被 trim，trim 后不能为空。
        同名知识库允许重复（当前没有唯一约束），因此不会返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreate'
      responses:
        '201':
          description: 创建成功
          headers:
            Location:
              description: 新资源的路径，例如 `/api/v1/collections/{id}`。
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/collections/{id}:
    parameters:
      - $ref: '#/components/parameters/CollectionID'

    get:
      tags: [collections]
      operationId: getCollection
      summary: 按 id 获取知识库
      responses:
        '200':
          description: 知识库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [collections]
      operationId: updateCollection
      summary: 按 PATCH 语义更新知识库
      description: |
        只更新请求中出现的字段；`null` 与缺省都表示“不改”。
        - `{"name":"新名字"}`：只改 name。
        - `{"description":""}`：清空 description。
        - `{}`：合法的 no-op，返回当前记录，不刷新 `updated_at`。
        - `name` 不能是空串；未知字段会返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdate'
      responses:
        '200':
          description: 更新后的完整知识库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [collections]
      operationId: deleteCollection
      summary: 软删知识库
      description: |
        软删后记录不再出现在查询和列表中。
        对不存在的 id，或对已经软删的 id 再次删除，都返回 404。
      responses:
        '204':
          description: 删除成功，无响应体
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [collections]
      operationId: restoreCollection
      summary: 恢复已软删知识库
      description: |
        将 `deleted_at` 置 NULL。资源不存在或已被 purge 物理删除返回 404；
        资源本来就是 active 返回 409。关联行保持原样。
      responses:
        '200':
          description: 恢复后的知识库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/documents:
    post:
      tags: [documents]
      operationId: createDocument
      summary: 创建文档元数据
      description: |
        `title` 必填，首尾空白会被 trim，trim 后不能为空。
        文档是全局资源，创建后可以加入多个 collection。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        '201':
          description: 创建成功
          headers:
            Location:
              description: 新资源路径，例如 `/api/v1/documents/{id}`。
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentID'

    get:
      tags: [documents]
      operationId: getDocument
      summary: 按 id 获取文档
      responses:
        '200':
          description: 文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [documents]
      operationId: updateDocument
      summary: 按 PATCH 语义更新文档元数据
      description: |
        空对象 `{}` 合法，表示 no-op。
        - `title`：缺省或 `null` 表示不改；空串/trim 后为空 → 400。
        - `source_uri` / `mime_type` / `size_bytes`：缺省表示不改；`null` 表示清空；
          传具体值表示设置。
        - 未知字段 → 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
      responses:
        '200':
          description: 更新后的完整文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: 软删文档
      description: |
        软删是全局的：文档不再出现在任何 collection 的列表里。
        `collection_documents` 关联行保留；物理清理由独立 purge 任务在保留期后执行。
        对不存在或已软删的 id 再次删除，返回 404。
      responses:
        '204':
          description: 删除成功，无响应体
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [documents]
      operationId: restoreDocument
      summary: 恢复已软删文档
      description: |
        将 `deleted_at` 置 NULL。资源不存在或已被 purge 物理删除返回 404；
        资源本来就是 active 返回 409。关联和正文保持原样。
      responses:
        '200':
          description: 恢复后的文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/documents/{id}/content:
    parameters:
      - $ref: '#/components/parameters/DocumentID'

    put:
      tags: [documents]
      operationId: replaceDocumentContent
      summary: 整体替换文档正文
      description: |
        事务内整体替换正文与分块，不是追加。文档不存在或已软删返回 404。
        `content` 为空/纯空白 → 400；UTF-8 字节数超过 1 MiB → 400。
        成功返回 204，无响应体。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDocumentContent'
      responses:
        '204':
          description: 替换成功，无响应体
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/documents/{id}/file:
    parameters:
      - $ref: '#/components/parameters/DocumentID'

    post:
      tags: [documents]
      operationId: uploadDocumentFile
      summary: 上传 PDF 并替换文档正文
      description: |
        `multipart/form-data`，字段名 `file`。服务端提取 PDF 文本后，
        走与 `PUT /documents/{id}/content` 相同的分块/事务/outbox 流程。
        文件名不可信，以 `%PDF-` 魔数为准；上限 20 MiB；无可提取文本返回 400。
        成功返回 204，无响应体。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '204':
          description: PDF 已解析并替换正文
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/collections/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/CollectionID'

    post:
      tags: [documents]
      operationId: addDocumentToCollection
      summary: 把已有文档加入知识库
      description: |
        关联是“有/没有”的子资源；重复添加返回 409。
        文档或知识库不存在/已软删返回 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentRequest'
      responses:
        '201':
          description: 关联创建成功
          headers:
            Location:
              description: 关联资源路径，例如 `/api/v1/collections/{id}/documents/{document_id}`。
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDocument'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [documents]
      operationId: listCollectionDocuments
      summary: 分页列出知识库下的文档
      description: |
        按 `(added_at DESC, document_id DESC)` 排序；`added_at` 是文档加入该 collection 的时间。
        已软删的文档不会出现在列表里。
        `next_cursor` 为 `null` 表示没有下一页。
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页条数，默认 20。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 `next_cursor`，原样回传；不要自己构造。
          schema:
            type: string
      responses:
        '200':
          description: 一页文档关联
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDocumentList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/collections/{id}/documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/CollectionID'
      - $ref: '#/components/parameters/CollectionDocumentID'

    delete:
      tags: [documents]
      operationId: removeDocumentFromCollection
      summary: 从知识库移除文档关联
      description: |
        只删除 `collection_documents` 关联，不删除文档本身；文档仍可从其他 collection 访问。
        关联不存在返回 404。
      responses:
        '204':
          description: 关联已移除，无响应体
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/search:
    get:
      tags: [search]
      operationId: searchChunks
      summary: 检索文档分块
      description: |
        基于 `document_chunks.content` 的 ngram FULLTEXT 检索，返回 chunk 粒度结果。
        `q` trim 后至少 2 个 rune（MySQL `ngram_token_size=2`）；1 个字符 → 400。
        结果按 `(score DESC, chunk_id DESC)` 排序；`next_offset` 为 `null` 表示没有下一页。
        不传 `collection_id` 时全局检索；传了但不存在/已软删 → 404。
        `offset + limit > 1000` → 400；到达 1000 窗口上限后 `next_offset` 为 `null`。
      parameters:
        - name: q
          in: query
          required: true
          description: 查询词，trim 后 2..256 个 rune。
          schema:
            type: string
            minLength: 2
            maxLength: 256
        - name: collection_id
          in: query
          required: false
          description: 只在该知识库内检索；不存在/已软删 → 404。
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: 每页条数，默认 20；`offset + limit` 不能超过 1000。
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          required: false
          description: 跳过条数，默认 0；`offset + limit` 不能超过 1000。
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 0
      responses:
        '200':
          description: 一页检索结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/agent/chat/stream:
    post:
      tags: [agent]
      operationId: agentChatStream
      summary: 单轮 RAG 流式问答（SSE）
      description: |
        与 `/api/v1/agent/chat` 相同的校验、检索和 citations 语义，但用
        `text/event-stream` 逐段返回。
        事件：
        - `token`：`{"delta":"..."}`
        - `done`：`{"citations":[...]}`
        - `error`：`{"message":"生成回答失败"}`
        没有检索结果时只发送固定 answer 的 token 与空 citations done，不调用 LLM。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: SSE 流；事件见 description
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/agent/chat:
    post:
      tags: [agent]
      operationId: agentChat
      summary: 单轮 RAG 问答
      description: |
        先检索相关 chunk，再把编号后的资料交给 LLM 生成回答。
        当前是单轮：不接收 conversation_id，也不保存对话历史。
        `citations` 返回本次检索到的来源，`index` 对应回答里的 `[n]` 编号；
        MVP 不校验模型是否真的写了正确的 `[n]`。
        没有检索结果时返回固定 answer 和空 citations，不调用 LLM。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: 回答与引用来源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    CollectionID:
      name: id
      in: path
      required: true
      description: 知识库 UUID。
      schema:
        type: string
        format: uuid

    DocumentID:
      name: id
      in: path
      required: true
      description: 文档 UUID。
      schema:
        type: string
        format: uuid

    CollectionDocumentID:
      name: document_id
      in: path
      required: true
      description: 文档 UUID（collection 关联路径参数）。
      schema:
        type: string
        format: uuid

  schemas:
    Collection:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: UTC，毫秒精度。
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: UTC，毫秒精度。

    CollectionCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 首尾空白会被 trim；trim 后不能为空。
        description:
          type: string
          maxLength: 1024
          default: ""
          nullable: true
          description: 不传或传 null 都按空串处理。

    CollectionUpdate:
      type: object
      additionalProperties: false
      description: |
        空对象 `{}` 合法，表示 no-op。
        字段为 null 或未出现都表示“不改”；清空 description 请传空串。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: 首尾空白会被 trim；trim 后不能为空。
        description:
          type: string
          maxLength: 1024
          nullable: true

    CollectionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        next_cursor:
          type: string
          nullable: true
          description: 没有下一页时为 null；否则原样回传。

    Document:
      type: object
      required: [id, title, source_uri, mime_type, size_bytes, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 512
        source_uri:
          type: string
          maxLength: 2048
          nullable: true
        mime_type:
          type: string
          maxLength: 128
          nullable: true
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: UTC，毫秒精度。
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: UTC，毫秒精度。

    DocumentCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: 首尾空白会被 trim；trim 后不能为空。
        source_uri:
          type: string
          maxLength: 2048
          nullable: true
          description: 不传、传 null、空串或纯空白都表示没有来源 URI（服务端统一折叠为 SQL NULL）。
        mime_type:
          type: string
          maxLength: 128
          nullable: true
          description: 不传、传 null、空串或纯空白都表示未知 MIME 类型（服务端统一折叠为 SQL NULL）。
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 不传或传 null 表示未知大小；0 是合法的 0 字节。

    DocumentUpdate:
      type: object
      additionalProperties: false
      description: |
        空对象 `{}` 合法，表示 no-op。
        - `title`：缺省或 null 都表示不改（title 是 NOT NULL，不能被清空）；空串/trim 后为空 → 400。
        - `source_uri` / `mime_type`：缺省表示不改；null、空串或纯空白表示清空为 SQL NULL。
        - `size_bytes`：缺省表示不改；null 表示清空；0 是合法的 0 字节。
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
        source_uri:
          type: string
          maxLength: 2048
          nullable: true
        mime_type:
          type: string
          maxLength: 128
          nullable: true
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true

    ReplaceDocumentContent:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          description: |
            完整正文。服务端按 UTF-8 字节数限制 1 MiB；空串/纯空白 → 400。
            分块由服务端完成，客户端不要自己切。

    AddDocumentRequest:
      type: object
      required: [document_id]
      additionalProperties: false
      properties:
        document_id:
          type: string
          format: uuid

    CollectionDocument:
      type: object
      required: [document, added_at]
      properties:
        document:
          $ref: '#/components/schemas/Document'
        added_at:
          type: string
          format: date-time
          readOnly: true
          description: 文档加入该 collection 的时间（UTC，毫秒精度）。

    CollectionDocumentList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionDocument'
        next_cursor:
          type: string
          nullable: true
          description: 没有下一页时为 null；否则原样回传。

    SearchHit:
      type: object
      required: [chunk_id, document_id, document_title, chunk_index, content, score]
      properties:
        chunk_id:
          type: string
          format: uuid
          readOnly: true
        document_id:
          type: string
          format: uuid
          readOnly: true
        document_title:
          type: string
          description: 命中 chunk 所属文档的标题。
        chunk_index:
          type: integer
          minimum: 0
          description: chunk 在文档内的序号，从 0 开始。
        content:
          type: string
          description: 命中的 chunk 原文；MVP 不做服务端高亮。
        score:
          type: number
          format: double
          description: FULLTEXT relevance score，仅用于本次查询排序。

    AgentChatRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        collection_id:
          type: string
          format: uuid
          nullable: true
          description: 可选；只在该知识库内检索。不存在/已软删 → 404。
        message:
          type: string
          minLength: 2
          maxLength: 4000
          description: 单轮问题；trim 后 2..4000 个 rune。

    AgentCitation:
      type: object
      required: [index, chunk_id, document_id, document_title, chunk_index, content, score]
      properties:
        index:
          type: integer
          minimum: 1
          description: 从 1 开始，对应 prompt 里的 [n]。
        chunk_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        document_title:
          type: string
        chunk_index:
          type: integer
          minimum: 0
        content:
          type: string
        score:
          type: number
          format: double

    AgentChatResponse:
      type: object
      required: [answer, citations]
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/AgentCitation'

    SearchResponse:
      type: object
      required: [items, next_offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        next_offset:
          type: integer
          minimum: 0
          maximum: 1000
          nullable: true
          description: |
            没有下一页、或已经到达 1000 窗口上限时为 null；
            否则把它作为下一次请求的 offset 原样传入。

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_argument, not_found, conflict, internal_error]
            message:
              type: string

  responses:
    InvalidArgument:
      description: 请求参数、JSON、UUID 或 cursor 不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 资源不存在或已被软删
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: 资源状态冲突（重复添加文档关联 / 重复恢复）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: 服务端内部错误；响应不包含内部细节
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
