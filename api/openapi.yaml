openapi: 3.0.3

info:
  title: KnowFlow Collections & Documents API
  version: 0.1.0
  description: |
    KnowFlow 知识库（collection）与文档（document）的 HTTP 契约。

    约定：
    - 成功响应直接返回资源 JSON，不套 `{data: ...}`。
    - 失败统一返回 `{"error":{"code":"...","message":"..."}}`。
    - 时间一律 UTC，RFC 3339 格式，毫秒精度。
    - `cursor` 是不透明 token；客户端只能原样回传，不要解析。
    - collections 列表按 `(created_at DESC, id DESC)` 排序。
    - 某个 collection 下的 documents 按 `(added_at DESC, document_id DESC)` 排序。

servers:
  - url: /

tags:
  - name: collections
    description: 知识库的创建、查询、分页、更新与软删。
  - name: documents
    description: 文档元数据，以及文档与知识库的多对多关联。

paths:
  /api/v1/collections:
    get:
      tags: [collections]
      operationId: listCollections
      summary: 分页列出知识库
      description: |
        返回按 `(created_at DESC, id DESC)` 排序的一页。
        `next_cursor` 为 `null` 表示没有下一页；否则把它原样作为下一次请求的 `cursor`。
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页条数，默认 20。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 `next_cursor`，原样回传；不要自己构造。
          schema:
            type: string
      responses:
        '200':
          description: 一页知识库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [collections]
      operationId: createCollection
      summary: 创建知识库
      description: |
        `name` 必填，首尾空白会被 trim，trim 后不能为空。
        同名知识库允许重复（当前没有唯一约束），因此不会返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreate'
      responses:
        '201':
          description: 创建成功
          headers:
            Location:
              description: 新资源的路径，例如 `/api/v1/collections/{id}`。
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/collections/{id}:
    parameters:
      - $ref: '#/components/parameters/CollectionID'

    get:
      tags: [collections]
      operationId: getCollection
      summary: 按 id 获取知识库
      responses:
        '200':
          description: 知识库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [collections]
      operationId: updateCollection
      summary: 按 PATCH 语义更新知识库
      description: |
        只更新请求中出现的字段；`null` 与缺省都表示“不改”。
        - `{"name":"新名字"}`：只改 name。
        - `{"description":""}`：清空 description。
        - `{}`：合法的 no-op，返回当前记录，不刷新 `updated_at`。
        - `name` 不能是空串；未知字段会返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdate'
      responses:
        '200':
          description: 更新后的完整知识库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [collections]
      operationId: deleteCollection
      summary: 软删知识库
      description: |
        软删后记录不再出现在查询和列表中。
        对不存在的 id，或对已经软删的 id 再次删除，都返回 404。
      responses:
        '204':
          description: 删除成功，无响应体
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [collections]
      operationId: restoreCollection
      summary: 恢复已软删知识库
      description: |
        将 `deleted_at` 置 NULL。资源不存在或已被 purge 物理删除返回 404；
        资源本来就是 active 返回 409。关联行保持原样。
      responses:
        '200':
          description: 恢复后的知识库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/documents:
    post:
      tags: [documents]
      operationId: createDocument
      summary: 创建文档元数据
      description: |
        `title` 必填，首尾空白会被 trim，trim 后不能为空。
        文档是全局资源，创建后可以加入多个 collection。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        '201':
          description: 创建成功
          headers:
            Location:
              description: 新资源路径，例如 `/api/v1/documents/{id}`。
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentID'

    get:
      tags: [documents]
      operationId: getDocument
      summary: 按 id 获取文档
      responses:
        '200':
          description: 文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [documents]
      operationId: updateDocument
      summary: 按 PATCH 语义更新文档元数据
      description: |
        空对象 `{}` 合法，表示 no-op。
        - `title`：缺省或 `null` 表示不改；空串/trim 后为空 → 400。
        - `source_uri` / `mime_type` / `size_bytes`：缺省表示不改；`null` 表示清空；
          传具体值表示设置。
        - 未知字段 → 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
      responses:
        '200':
          description: 更新后的完整文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: 软删文档
      description: |
        软删是全局的：文档不再出现在任何 collection 的列表里。
        `collection_documents` 关联行保留；物理清理由独立 purge 任务在保留期后执行。
        对不存在或已软删的 id 再次删除，返回 404。
      responses:
        '204':
          description: 删除成功，无响应体
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [documents]
      operationId: restoreDocument
      summary: 恢复已软删文档
      description: |
        将 `deleted_at` 置 NULL。资源不存在或已被 purge 物理删除返回 404；
        资源本来就是 active 返回 409。关联和正文保持原样。
      responses:
        '200':
          description: 恢复后的文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/collections/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/CollectionID'

    post:
      tags: [documents]
      operationId: addDocumentToCollection
      summary: 把已有文档加入知识库
      description: |
        关联是“有/没有”的子资源；重复添加返回 409。
        文档或知识库不存在/已软删返回 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentRequest'
      responses:
        '201':
          description: 关联创建成功
          headers:
            Location:
              description: 关联资源路径，例如 `/api/v1/collections/{id}/documents/{document_id}`。
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDocument'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [documents]
      operationId: listCollectionDocuments
      summary: 分页列出知识库下的文档
      description: |
        按 `(added_at DESC, document_id DESC)` 排序；`added_at` 是文档加入该 collection 的时间。
        已软删的文档不会出现在列表里。
        `next_cursor` 为 `null` 表示没有下一页。
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页条数，默认 20。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 `next_cursor`，原样回传；不要自己构造。
          schema:
            type: string
      responses:
        '200':
          description: 一页文档关联
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDocumentList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/collections/{id}/documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/CollectionID'
      - $ref: '#/components/parameters/CollectionDocumentID'

    delete:
      tags: [documents]
      operationId: removeDocumentFromCollection
      summary: 从知识库移除文档关联
      description: |
        只删除 `collection_documents` 关联，不删除文档本身；文档仍可从其他 collection 访问。
        关联不存在返回 404。
      responses:
        '204':
          description: 关联已移除，无响应体
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    CollectionID:
      name: id
      in: path
      required: true
      description: 知识库 UUID。
      schema:
        type: string
        format: uuid

    DocumentID:
      name: id
      in: path
      required: true
      description: 文档 UUID。
      schema:
        type: string
        format: uuid

    CollectionDocumentID:
      name: document_id
      in: path
      required: true
      description: 文档 UUID（collection 关联路径参数）。
      schema:
        type: string
        format: uuid

  schemas:
    Collection:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: UTC，毫秒精度。
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: UTC，毫秒精度。

    CollectionCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 首尾空白会被 trim；trim 后不能为空。
        description:
          type: string
          maxLength: 1024
          default: ""
          nullable: true
          description: 不传或传 null 都按空串处理。

    CollectionUpdate:
      type: object
      additionalProperties: false
      description: |
        空对象 `{}` 合法，表示 no-op。
        字段为 null 或未出现都表示“不改”；清空 description 请传空串。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: 首尾空白会被 trim；trim 后不能为空。
        description:
          type: string
          maxLength: 1024
          nullable: true

    CollectionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        next_cursor:
          type: string
          nullable: true
          description: 没有下一页时为 null；否则原样回传。

    Document:
      type: object
      required: [id, title, source_uri, mime_type, size_bytes, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 512
        source_uri:
          type: string
          maxLength: 2048
          nullable: true
        mime_type:
          type: string
          maxLength: 128
          nullable: true
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: UTC，毫秒精度。
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: UTC，毫秒精度。

    DocumentCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: 首尾空白会被 trim；trim 后不能为空。
        source_uri:
          type: string
          maxLength: 2048
          nullable: true
          description: 不传、传 null、空串或纯空白都表示没有来源 URI（服务端统一折叠为 SQL NULL）。
        mime_type:
          type: string
          maxLength: 128
          nullable: true
          description: 不传、传 null、空串或纯空白都表示未知 MIME 类型（服务端统一折叠为 SQL NULL）。
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 不传或传 null 表示未知大小；0 是合法的 0 字节。

    DocumentUpdate:
      type: object
      additionalProperties: false
      description: |
        空对象 `{}` 合法，表示 no-op。
        - `title`：缺省或 null 都表示不改（title 是 NOT NULL，不能被清空）；空串/trim 后为空 → 400。
        - `source_uri` / `mime_type`：缺省表示不改；null、空串或纯空白表示清空为 SQL NULL。
        - `size_bytes`：缺省表示不改；null 表示清空；0 是合法的 0 字节。
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
        source_uri:
          type: string
          maxLength: 2048
          nullable: true
        mime_type:
          type: string
          maxLength: 128
          nullable: true
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true

    AddDocumentRequest:
      type: object
      required: [document_id]
      additionalProperties: false
      properties:
        document_id:
          type: string
          format: uuid

    CollectionDocument:
      type: object
      required: [document, added_at]
      properties:
        document:
          $ref: '#/components/schemas/Document'
        added_at:
          type: string
          format: date-time
          readOnly: true
          description: 文档加入该 collection 的时间（UTC，毫秒精度）。

    CollectionDocumentList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionDocument'
        next_cursor:
          type: string
          nullable: true
          description: 没有下一页时为 null；否则原样回传。

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_argument, not_found, conflict, internal_error]
            message:
              type: string

  responses:
    InvalidArgument:
      description: 请求参数、JSON、UUID 或 cursor 不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 资源不存在或已被软删
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: 资源状态冲突（重复添加文档关联 / 重复恢复）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: 服务端内部错误；响应不包含内部细节
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
