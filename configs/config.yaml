# KnowFlow apid 默认配置
#
# 加载优先级（高者覆盖低者）：内置默认值 < 本文件 < 环境变量（KF_ 前缀）
# 为什么把默认配置提交进仓库：新人 clone 下来就能跑，不需要"问同事要一份配置"。
# 凡是密钥都不写在这里——只从环境变量读。

app:
  name: knowflow-apid
  env: dev # dev / test / prod；影响日志级别与错误详情是否外露

server:
  addr: ":8080" # ":8080" = 监听所有网卡；只给本机用写成 "127.0.0.1:8080"
  read_timeout: 5s # 读完整请求（header+body）的上限，防慢客户端一直占着连接
  write_timeout: 10s # 写响应的上限
  idle_timeout: 60s # keep-alive 空闲连接保持多久
  shutdown_timeout: 15s # 优雅退出时，最多等在途请求多久（超时则强制关）

database:
  host: "127.0.0.1" # 本地 docker compose 起的 MySQL；生产用 KF_DATABASE_HOST 覆盖
  port: 3306 # 与 deploy/.env 的 MYSQL_PORT 对应
  name: knowflow # 库名（deploy/.env 的 MYSQL_DATABASE）
  user: knowflow # 应用账号，刻意不用 root（deploy/.env 的 MYSQL_USER）
  # password 刻意不写在这里：它只从 KF_DATABASE_PASSWORD 读。
  # 配置文件会跟着 Git 走遍所有 clone，环境变量不会（AGENTS.md §1.1）。
  # 顺带：真往这里写 password 会被 KnownFields(true) 直接拒绝启动。
  max_open_conns: 10 # 连接池上限；MySQL 默认 max_connections=151，要留余量给运维连接
  max_idle_conns: 5 # 空闲连接数，必须 ≤ max_open_conns
  conn_max_lifetime: 30m # 必须 < MySQL wait_timeout（默认 8h），否则会捡到已被服务端关闭的连接
  conn_max_idle_time: 5m # 空闲连接多久归还给 MySQL

redis:
  addr: "" # 空 = 关闭缓存；本地/生产设为 redis:6379
  db: 0
  timeout: 2s
  search_ttl: 30s
  # password 只从 KF_REDIS_PASSWORD 读

llm:
  base_url: "https://api.deepseek.com" # OpenAI-compatible；DeepSeek 默认
  model: "deepseek-chat"
  # api_key 刻意不写在这里：它只从 KF_LLM_API_KEY 读。
  timeout: 60s
  max_tokens: 1024

embedding:
  ollama_url: "http://127.0.0.1:11434"
  model: "bge-m3"
  timeout: 120s
  batch_size: 16

qdrant:
  url: "http://127.0.0.1:6333"
  collection: "document_chunks"
  vector_size: 1024
  timeout: 10s

retrieval:
  mode: fts # fts / vector / hybrid；评测通过后再切 hybrid
  candidates: 20
  rrf_k: 60

log:
  level: info # debug / info / warn / error
  format: json # json（线上，便于按字段检索）/ text（本地肉眼读）
